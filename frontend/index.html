<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Chat</title>
<meta name="description" content="Chat interface for the RAG + OCR chatbot — ask questions and get answers grounded in your ingested document set.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ui.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='20'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" data-icon="chat" data-size="18"></div>
      <div class="brand-text">
        <div class="brand-name">Document Chat</div>
        <div class="brand-sub">RAG &middot; OCR</div>
      </div>
    </div>

    <nav class="nav">
      <button class="btn btn-primary btn-block mb-2" id="newChat">
        <span data-icon="plus" data-size="15"></span> New conversation
      </button>

      <div class="nav-label">Conversations</div>
      <div id="threadList"></div>
    </nav>

    <div class="sidebar-foot">
      <div class="conn" id="conn"><span class="dot"></span><span class="conn-text">Checking API...</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-ghost btn-icon menu-btn" data-icon="menu" data-size="19" aria-label="Open navigation"></button>
      <h1 id="threadTitle">New conversation</h1>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-icon" id="exportChat" title="Download this conversation" data-icon="download" data-size="18"></button>
      <button class="btn btn-ghost btn-icon" data-theme-toggle></button>
    </header>

    <div class="chat">
      <div class="chat-scroll" id="messages"></div>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="prompt" class="composer-input" rows="1" placeholder="Ask anything about your documents..." autocomplete="off"></textarea>
          <button class="btn btn-primary btn-icon composer-send" type="submit" id="sendBtn" aria-label="Send">
            <span data-icon="send" data-size="17"></span>
          </button>
        </form>
        <div class="composer-hint">
          <kbd>Enter</kbd> to send &middot; <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/ui.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
